name: XKCD cache update

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    env:
      CACHE_TAG: cache-latest
      CACHE_ASSET: cache.tar.gz
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra build-cache

      - name: Download previous cache from release
        run: |
          if gh release view "$CACHE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found existing release $CACHE_TAG; downloading asset $CACHE_ASSET"
            gh release download "$CACHE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$CACHE_ASSET" \
              --output "$CACHE_ASSET" \
              --clobber
            tar -xzf "$CACHE_ASSET"
            rm -f "$CACHE_ASSET"
          else
            echo "No existing $CACHE_TAG release; starting from empty cache."
          fi

      - name: Rebuild caches
        run: |
          uv run python - <<'PY'
          import random
          from explainxkcd import ExplainXKCDScraper
          from embedding_search import EmbeddingCache

          scraper = ExplainXKCDScraper()
          scraper.hydrate_and_refresh_cache()
          explanations = scraper.load_cache()

          # Incremental embeddings: only embed comics missing from the index
          cache = EmbeddingCache()
          missing = [n for n in sorted(explanations.keys()) if not cache.has(str(n))]
          for n in missing:
              cache.get_or_compute(str(n), explanations[n])

          # Recompute embeddings for the last item in cache
          if explanations:
            last_comic = max(explanations.keys())
            cache.get_or_compute(str(last_comic), explanations[last_comic], force=True)

          # Force update ten random explanations
          if len(explanations) >= 10:
              random_comics = random.sample(list(explanations.keys()), 10)
              for comic_id in random_comics:
                  cache.get_or_compute(str(comic_id), explanations[comic_id], force=True)
          PY

      - name: Pack and upload cache to release
        run: |
          tar -czf "$CACHE_ASSET" embeddings_cache explainxkcd_cache
          ls -lh "$CACHE_ASSET"
          if ! gh release view "$CACHE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CACHE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "XKCD cache (latest)" \
              --notes "Auto-updated by the daily cache workflow. Contains embeddings_cache/ and explainxkcd_cache/."
          fi
          gh release upload "$CACHE_TAG" "$CACHE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
